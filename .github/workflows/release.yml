# Publish a GitHub release, started by hand (Actions > release > Run workflow, on main).
# The version is major.minor from version.yml plus the next free patch number. The workflow runs the
# checks, builds the zip, and creates the tag v<version> on the commit it ran on together with the release.
# Tags v*.* are immutable (version-tags ruleset), so a bad release means a new version, not a fix in place.
# Not uploaded to CurseForge yet.
name: release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  checks:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/checks.yml

  release:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Work out the version
        id: version
        run: echo "version=$(python3 tools/next_version.py)" >> "$GITHUB_OUTPUT"
      - name: Build the zip
        run: python3 tools/build_zip.py "${{ steps.version.outputs.version }}"
      - name: Create the tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" "dist/RotateMinimap-$VERSION.zip" \
            --target "$GITHUB_SHA" \
            --title "RotateMinimap $VERSION" \
            --generate-notes
