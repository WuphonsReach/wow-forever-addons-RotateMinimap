# Publish a GitHub release, started by hand (Actions > release > Run workflow, on main).
# The version is major.minor from version.yml plus the next free patch number, and CHANGELOG.md's top
# section must already be headed with it (rename '## Unreleased' in a PR first). The workflow runs the
# checks, builds the zip, and creates the tag v<version> on the commit it ran on together with the release,
# with that CHANGELOG section as the notes.
# Tags v*.* are immutable (version-tags ruleset), so a bad release means a new version, not a fix in place.
# Not uploaded to CurseForge yet.
name: release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  main-only:
    runs-on: ubuntu-latest
    steps:
      - name: Releases are made from main
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Run the release workflow on main, not $REF"
            exit 1
          fi

  checks:
    needs: main-only
    uses: ./.github/workflows/checks.yml

  release:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Work out the version
        id: version
        run: |
          version=$(python3 tools/next_version.py)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # Fails unless CHANGELOG.md's top section is headed with this version.
      - name: Release notes from CHANGELOG.md
        run: python3 tools/release_notes.py "${{ steps.version.outputs.version }}" > "$RUNNER_TEMP/notes.md"
      - name: Build the zip
        run: python3 tools/build_zip.py "${{ steps.version.outputs.version }}"
      - name: Create the tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" "dist/RotateMinimap-$VERSION.zip" \
            --target "$GITHUB_SHA" \
            --title "RotateMinimap $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md"
